desc = Activities at the Kolibri Foundation in Bukit Lawang help children from underprivileged families, children without parents, and children whose parents are divorced to continue their education through caring and open-hearted sponsors in a sustainable way. The Kolibri Foundation in Bukit Lawang also helps children learn English, play music, guitar, games, sports, and more at Kolibri House in Bukit Lawang. The Kolibri Foundation in Bukit Lawang gives its best because we are happy when we see children happy. If there are guests who book activities such as jungle trek tours, village accommodations, or car rentals, it contributes to the activities at the Kolibri Foundation in Bukit Lawang.
