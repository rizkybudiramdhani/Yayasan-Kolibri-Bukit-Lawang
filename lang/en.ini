tentang = About our foundation : The Bukit Lawang Kolibri Foundation, which has been established independently since 2018 in Bukit Lawang, aims to help underprivileged children to go to school. Our goal is to help children around Bukit Lawang who don`t go to school, and don`t enrich themselves, but for that we need you Let`s change the world for them so that they can smile. We are happy when the children are happy too. 
tentang2 =You can also donate starting from 10 euros to support activities at the Kolibri House. Alternatively, you can become a sponsor starting from 20 euros per month to ensure that the children can continue their education. Of course, you will receive monthly updates from them via email, WhatsApp, or social media. So, <i><a>please click Donate via the homepage</a></i> to contribute 10 euros. We deeply appreciate your participation, and may God reward all your kindness.If you wish to sponsor a child, it also includes a contribution when guests book a jungle trek in Bukit Lawang through the Kolibri Foundation. A 3% share of the proceeds will go to Kolibri House. For guests who book jungle treks through the Kolibri Foundation, it is already a great help and contribution to the Kolibri Foundation in Bukit Lawang.
